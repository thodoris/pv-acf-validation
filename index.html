  <head>
    <meta charset="UTF-8" />

    <title>PV-ACF · Expert Validation</title>

    <!--
      Fonts: GFS Neohellenic (display) + IBM Plex Sans (body/UI) + IBM Plex Mono (metadata).
      Greek + Latin subsets — Google Fonts CSS API serves @font-face with unicode-range, so
      Greek woff2 is fetched on-demand only when text in the Greek code point range renders
      (i.e. when a reviewer types Greek into an open textbox).
      TODO (deferred per docs/SOURCE_OF_TRUTH.md row 7): self-host woff2 in public/fonts/ and
      drop the CDN dependency. Add <link rel="preload"> for Latin subsets once self-hosted.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=GFS+Neohellenic:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=greek,latin"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root" data-screen-label="PV-ACF Expert Validation"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
