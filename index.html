<!DOCTYPE html>
<!--
  data-variant is the source of truth for SHORT/FULL copy forks in the CSS
  (.hide-in-short / .hide-in-full). The initial value matches the post-flip
  default (SHORT) so first paint is correct before App.tsx mirrors the live
  store value into the attribute. See CLAUDE.md → variant copy lever.
-->
<html lang="en" data-variant="short">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <meta name="description" content="PV-ACF Expert Validation Platform — a guided single-session expert review environment." />
    <title>PV-ACF · Expert Validation</title>

    <!--
      Fonts: GFS Neohellenic (display) + IBM Plex Sans (body/UI) + IBM Plex Mono (metadata).
      Greek + Latin subsets — Google Fonts CSS API serves @font-face with unicode-range, so
      Greek woff2 is fetched on-demand only when text in the Greek code point range renders
      (i.e. when a reviewer types Greek into an open textbox).
      TODO (deferred per docs/SOURCE_OF_TRUTH.md row 7): self-host woff2 in public/fonts/ and
      drop the CDN dependency. Add <link rel="preload"> for Latin subsets once self-hosted.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=GFS+Neohellenic:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=greek,latin"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>
      <style>#root { display: none; }</style>
      <div
        style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; max-width: 640px; margin: 64px auto; padding: 32px; line-height: 1.6; color: #1a1a1a;"
      >
        <h1 style="font-size: 24px; margin: 0 0 16px;">JavaScript required</h1>
        <p style="margin: 0 0 16px;">
          The PV-ACF expert validation questionnaire needs JavaScript to run.
          Please enable JavaScript in your browser settings and reload this page.
        </p>
        <p style="margin: 0; color: #555; font-size: 14px;">
          If you have already enabled JavaScript and still see this message, your
          browser may be blocking the page&rsquo;s script — check for content blockers
          or strict privacy extensions.
        </p>
      </div>
    </noscript>
    <div id="root" data-screen-label="PV-ACF Expert Validation"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
